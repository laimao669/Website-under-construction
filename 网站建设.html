<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站建设中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e0f7fa;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            margin: 20px;
            transition: all 0.4s ease;
        }
        
        .container:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(-5px);
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
            transition: all 0.4s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #e0f7fa;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #b2ebf2;
        }
        
        .progress-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00bcd4, #006064);
            border-radius: 4px;
            animation: progress 3s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .contact-info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .contact-info:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }
        
        .contact-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #80deea;
        }
        
        .contact-info p {
            font-size: 16px;
            margin-bottom: 5px;
            color: #b2ebf2;
        }
        
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .icp-link {
            color: #b2ebf2;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .icp-link:hover {
            color: #00bcd4;
            background: rgba(0, 188, 212, 0.1);
            text-shadow: 0 0 8px rgba(0, 188, 212, 0.7);
        }
        
        .countdown {
            font-size: 24px;
            font-weight: bold;
            color: #00bcd4;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }
            
            p {
                font-size: 16px;
            }
            
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚧</div>
        <h1>网站正在建设中</h1>
        <p>我们正在进行网站升级与维护，精彩内容即将上线！</p>
        <p>感谢您的耐心等待，我们将为您提供更好的体验。</p>
        <h3>400-110-6670</h3>

    </div>
    
    <footer>
        <a href="https://beian.miit.gov.cn/" target="_blank" class="icp-link">
            陕ICP备2024026802号-2
        </a>
    </footer>
</body>
</html>
